name: Build ViperX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore solution
        run: dotnet restore .\ViperX.sln
      - name: Build solution
        run: dotnet build .\ViperX.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test .\ViperX.sln --configuration Release --no-build
