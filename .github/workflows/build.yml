name: Build ViperX

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: viperx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore solution
        run: dotnet restore .\ViperX.sln
      - name: Build solution
        run: dotnet build .\ViperX.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test .\ViperX.sln --configuration Release --no-build
      - name: Publish self-contained Windows x64 launcher
        run: dotnet publish .\ViperX.App\ViperX.App.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true --output .\artifacts\ViperX
      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViperX-win-x64
          path: artifacts/ViperX/
          if-no-files-found: error
          retention-days: 14
